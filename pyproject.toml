[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "0.1.0"
description = "A reproducible heart-disease prediction demo with a Streamlit UI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "imbalanced-learn>=0.12,<1",
    "joblib>=1.3,<2",
    "mlflow>=2.16,<4",
    "pandas>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.4,<2",
    "streamlit>=1.36,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.8,<4",
    "pre-commit>=3,<4",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "seaborn>=0.13,<2",
    "tqdm>=4.66,<5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
