services:
  web:
    build: .
    image: heart-disease-mlops
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      - HEART_API_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api

  api:
    build: .
    image: heart-disease-mlops
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
